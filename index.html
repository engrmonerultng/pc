
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kishoreganj PBS Map</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f1f5f9;
    text-align: center;
}

header {
    background: #064e3b;
    color: white;
    padding: 18px;
}

.map-container {
    max-width: 900px;
    margin: 20px auto;
    padding: 10px;
    background: white;
    border-radius: 10px;
}

svg {
    width: 100%;
    height: auto;
    background: #e8f2e8;
    border: 1px solid #aaa;
}

.area {
    fill: #86efac;
    stroke: #333;
    stroke-width: 2;
    cursor: pointer;
}

.area:hover {
    stroke: red;
    stroke-width: 4;
}

.area.off {
    fill: #111827;
}

.area.light {
    fill: #bbf7d0;
}

.area-label {
    font-size: 13px;
    fill: #111;
    font-weight: bold;
    pointer-events: none;
}

.legend {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    margin: 15px;
}

.legend span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

.color {
    width: 18px;
    height: 18px;
    display: inline-block;
    border: 1px solid #333;
}

button {
    padding: 9px 15px;
    margin: 5px;
    border: 0;
    border-radius: 5px;
    cursor: pointer;
}

.on-btn { background: #22c55e; }
.light-btn { background: #bbf7d0; }
.off-btn { background: #111827; color: white; }

footer {
    padding: 15px;
    color: #555;
}
</style>
</head>

<body>

<header>
    <h2>KISHOREGANJ PALLI BIDYUT SAMITY</h2>
    <h3>Kishoreganj Sadar Electricity Map</h3>
</header>

<div class="map-container">

    <h3>Electricity Supply Area Map</h3>

    <div class="legend">
        <span><i class="color" style="background:#86efac"></i> Electricity ON</span>
        <span><i class="color" style="background:#bbf7d0"></i> Partial Supply</span>
        <span><i class="color" style="background:#111827"></i> Electricity OFF</span>
    </div>

    <p>Click any area on the map to change its status.</p>

    <svg viewBox="0 0 700 650">

        <!-- Outer map boundary -->
        <path d="M170 40 L350 25 L520 85 L635 210
                 L600 390 L520 550 L340 620
                 L170 570 L65 430 L85 210 Z"
              fill="#f0fdf4"
              stroke="#166534"
              stroke-width="5"/>

        <!-- Main road -->
        <path d="M80 300 Q250 250 350 330
                 T620 270"
              fill="none"
              stroke="#d97706"
              stroke-width="9"/>

        <path d="M350 30 Q320 200 350 330
                 T340 610"
              fill="none"
              stroke="#d97706"
              stroke-width="7"/>

        <!-- Area 1 -->
        <polygon class="area"
          points="175,65 330,45 350,180 220,220 115,160"
          onclick="changeStatus(this)"/>
        <text class="area-label" x="215" y="135">Area 1</text>

        <!-- Area 2 -->
        <polygon class="area"
          points="350,45 510,95 550,205 420,230 350,180"
          onclick="changeStatus(this)"/>
        <text class="area-label" x="420" y="150">Area 2</text>

        <!-- Area 3 -->
        <polygon class="area"
          points="115,160 220,220 250,340 100,360 75,260"
          onclick="changeStatus(this)"/>
        <text class="area-label" x="135" y="285">Area 3</text>

        <!-- Area 4 -->
        <polygon class="area"
          points="220,220 350,180 420,230 390,350 250,340"
          onclick="changeStatus(this)"/>
        <text class="area-label" x="295" y="280">Area 4</text>

        <!-- Area 5 -->
        <polygon class="area"
          points="420,230 550,205 610,300 520,390 390,350"
          onclick="changeStatus(this)"/>
        <text class="area-label" x="480" y="305">Area 5</text>

        <!-- Area 6 -->
        <polygon class="area"
          points="100,360 250,340 270,490 170,550 80,440"
          onclick="changeStatus(this)"/>
        <text class="area-label" x="155" y="430">Area 6</text>

        <!-- Area 7 -->
        <polygon class="area"
          points="250,340 390,350 420,500 270,490"
          onclick="changeStatus(this)"/>
        <text class="area-label" x="315" y="425">Area 7</text>

        <!-- Area 8 -->
        <polygon class="area"
          points="390,350 520,390 550,520 420,580 420,500"
          onclick="changeStatus(this)"/>
        <text class="area-label" x="455" y="455">Area 8</text>

        <!-- Area 9 -->
        <polygon class="area"
          points="170,550 270,490 420,500 420,580
                  340,610 200,585"
          onclick="changeStatus(this)"/>
        <text class="area-label" x="290" y="555">Area 9</text>

    </svg>

    <div>
        <button class="on-btn" onclick="setAll('on')">
            All ON
        </button>

        <button class="light-btn" onclick="setAll('light')">
            Partial Supply
        </button>

        <button class="off-btn" onclick="setAll('off')">
            All OFF
        </button>
    </div>

</div>

<footer>
    Designed for Kishoreganj Palli Bidyut Samity
</footer>

<script>
function changeStatus(area) {
    if (!area.classList.contains("off") &&
        !area.classList.contains("light")) {
        area.classList.add("off");
    }
    else if (area.classList.contains("off")) {
        area.classList.remove("off");
        area.classList.add("light");
    }
    else {
        area.classList.remove("light");
    }
}

function setAll(status) {
    document.querySelectorAll(".area").forEach(area => {
        area.classList.remove("off", "light");

        if (status === "off") {
            area.classList.add("off");
        }

        if (status === "light") {
            area.classList.add("light");
        }
    });
}
</script>

</body>
</html>
